phase: PH-06
slice: PS03_LEAVE
goal: Prove employee leave submission through workflow, balance ledger, PS04-ready SR outbox, audit, and notification.
state_machine_contract: docs/contracts/state-machines.yaml#/modules/PS03/machines/leave_application
openapi_contract: docs/contracts/openapi/PS03.yaml
implemented_routes:
  - POST /api/v1/atl/leave-applications
  - GET /api/v1/atl/leave-applications
  - POST /api/v1/atl/leave-applications/{id}/decision
  - GET /api/v1/atl/leave-balances
  - GET /api/v1/atl/leave-sr-outbox
workflow:
  code: WF-PS03-LEAVE
  resolver: REPORTING_CHAIN
  actions: [DELEGATE, APPROVE, REJECT]
domain_steps:
  - submit reserves leave balance and writes a P05 audit row
  - P01 delegate records delegation evidence without changing module approval logic
  - approve debits leave balance, creates a PS04 outbox event, and posts LEAVE_APPROVED through PS12 as sourceModule PS04
platform_evidence:
  P01: workflow_instances, workflow_tasks, workflow_actions
  P02: Authorization.check on protected routes and service operations
  P05: PS03_LEAVE_SUBMIT, PS03_LEAVE_DELEGATE, PS03_LEAVE_APPROVE
  PS01: employee master lookup before submit
  PS12: LEAVE_APPROVED SR event with sourceModule PS04
  X.2: PS03_LEAVE_SUBMITTED, PS03_LEAVE_DELEGATED, PS03_LEAVE_APPROVED notifications
acceptance_tests:
  - apps/api/test/ph06-ps03-leave.test.cjs
rollback:
  feature_flag: disable PS03 leave routes; keep P01/PS12/PS13 online
