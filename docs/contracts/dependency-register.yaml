# =============================================================================
# primesoft-hrms (PrimeSoft platform) — Machine-Readable Dependency Register
# =============================================================================
# Purpose : Per-module dependency contract driving the dependency-ordered build
#           plan (docs/phased-plan.md). Ground truth is docs/brd/v3/*, the
#           consolidated 403-table schema (docs/data-model/), MODULE_RECONCILIATION.md
#           and PLATFORM_FOUNDATION.md. No dependency here is invented — each
#           traces to a BRD "Alignment with PrimeSoft platform" / out-of-scope /
#           cross-feature-dependency / traceability section or the schema build order.
#
# Legend:
#   type                    : net-new | extend | phase-2
#   platform_services_consumed : P01 Workflow · P02 RBAC/Authorization.check ·
#                                P03 Chat · P04 Tenant/Org Admin · P05 Audit ·
#                                P06 Migration · X (X.1 jobs / X.2 notify / X.3 integration) ·
#                                W (W.1 flows / W.2 forms / W.3 notify-config)
#   hard_dependencies       : MUST be built and integrable before this module
#                             (real coupling: consumes owned data / write-port / gate)
#   soft_dependencies       : can be mocked/stubbed at build time (event ref,
#                             read-only lookup, downstream ack, optional enrichment)
#   sr_role                 : writer (in PS12 FR-01.B canonical statutory writer set) |
#                             consumer (reads SR) | none | owner (the ledger itself)
#   effort                  : S | M | L | XL  (schema size + statutory complexity + net-new)
# =============================================================================

meta:
  program: primesoft-hrms on PrimeSoft platform
  module_count: 14
  schema_tables_total: 403
  authority_order:
    - PLATFORM_FOUNDATION.md         # platform build contract (P01-P06/X/W, RBAC, VAL-*, API/error)
    - MODULE_RECONCILIATION.md       # net-new vs extend map; SR ownership; convention overrides
    - docs/data-model/README.md      # 15-file load order (00 core -> 14), collisions fixed
    - docs/brd/v3/*                  # 14 authoritative platform-grounded BRDs
  sr_canonical_writer_set:           # PS12 FR-01.B (authoritative). Note: PS03 is NOT a writer; PS11 IS.
    [PS01, PS04, PS05, PS06, PS08, PS09, PS10, PS11]
  platform_services_ready_before_any_module: [P01, P02, P03, P04, P05, P06, X, W]

# -----------------------------------------------------------------------------
# Shared contracts — the seams cross-module integration review (R1-R5) fixed.
# Owned by exactly one module; everyone else references by id, never forks.
# -----------------------------------------------------------------------------
shared_contracts:
  sr_ingestion_contract:
    name: Digital Service Register ingestion write-port
    owner: PS12
    endpoint: POST /api/v1/sr/ingest
    ledger_entity: service_register_events        # append-only, on P05 immutability substrate
    properties: [idempotent, versioned, schema-validated, provenance-stamped, semantic-per-fact-dedup, source-driven-reversal]
    substrate: P05 (DB-trigger, immutable, 7-yr, hash-chain OPEN-PLAT-03)
    ledger_core_location: docs/data-model/00-platform-core.sql   # SR ledger core is Phase-0 core
    supporting_tables_location: docs/data-model/12-PS12-digital-service-register.sql
    writers: [PS01, PS04, PS05, PS06, PS08, PS09, PS10, PS11]   # source_module stamp on each event
    readers_consumers: [PS11, PS14, PS02]                   # PS11 verify/qualifying-service, PS14 analytics, PS02 status-track
    grounding: PS12 FR-01/FR-02 (FR-01.B canonical writer set); MODULE_RECONCILIATION.md §C/§D
  employee_master:
    name: Canonical employee master (extends PrimeSoft M01)
    owner: PS01
    core_entity: employees                         # 00-platform-core.sql
    gov_additions: [service_no, cadre, pay_scale_id, posting_history, aliases, aadhaar_vault, attribute/position_history]
    referenced_by: [PS02, PS03, PS04, PS05, PS06, PS07, PS08, PS09, PS10, PS11, PS13, PS14]
    grounding: MODULE_RECONCILIATION.md §A(PS01)/§D
  documents:
    name: Document object store / vault (extends PrimeSoft M11)
    owner: PS13
    core_entity: documents                         # 00-platform-core.sql (documents core)
    gov_additions: [statutory document classes, retention schedules, legal-hold, DLP, clearance]
    referenced_by: [PS01, PS05, PS06, PS08, PS09, PS11, PS14]
    grounding: MODULE_RECONCILIATION.md §A(PS13); schema note (renamed to document_retention_policies/document_legal_holds to avoid PS01 collision)
  audit:
    name: Dual audit/compliance log
    owner: P05 (platform-provided — never redefined by any enterprise module)
    entities: [audit_log, security_audit_log]
    capture: DB-trigger, immutable, 7-yr, tamper-evidence tracks OPEN-PLAT-03
    consumed_by: all_modules
    grounding: PLATFORM_FOUNDATION.md §5(P05); MODULE_RECONCILIATION.md §C
  workflow_platform:
    name: P01 workflow execution substrate and SPI boundary
    owner: P01
    core_entities:
      - workflows
      - workflow_instances
      - workflow_actions
      - workflow_idempotency_records
      - workflow_resolution_snapshots
      - workflow_tasks
      - workflow_waits
      - workflow_fork_executions
      - workflow_fork_branches
      - workflow_references
    reusable_packages:
      - /Users/n15318/workflow-platform/packages/workflow-core
      - /Users/n15318/workflow-platform/packages/workflow-postgres
      - /Users/n15318/workflow-platform/packages/workflow-config
      - /Users/n15318/workflow-platform/packages/workflow-resolvers
      - /Users/n15318/workflow-platform/packages/adapters-hrms
    resolver_spi: ApproverResolver with WORK_QUEUE default; reporting-chain/statutory authority implemented in PH-01/PH-02
    consumed_by: [PS02, PS03, PS04, PS05, PS06, PS07, PS08, PS09, PS10, PS11, PS13, PS14]
    grounding: PLATFORM_FOUNDATION.md §5(P01); docs/spec/workflow-platform-contract.yaml; docs/spec/workflow-platform-governance.md
  ph03_foundation_services:
    name: PH-03 core platform service layer
    owner: platform/core-services
    implementation_root: apps/api/src
    build_contract:
      package: package.json
      typecheck: npm run typecheck
      test: npm run check
      gate: bash docs/spec/pipeline/checks/ph-03.sh
    service_boundaries:
      p01_workflow_adapter:
        path: apps/api/src/platform/workflow
        consumes: [workflow_platform, authority_resolution, audit, notifications]
        exposes: [workflow.start, workflow.act, workflow.synthetic_hrms_flow]
      authority_resolution:
        path: apps/api/src/platform/authority-resolution
        consumes: [employee_master, ph02_authority_fixture_contract]
        exposes: [REPORTING_CHAIN, POSITION_AUTHORITY, STATUTORY_AUTHORITY, ORG_UNIT_HEAD, NAMED_ROLE, NAMED_USER, WORK_QUEUE, COMMITTEE, DELEGATION_OR_ACTING_CHARGE]
      p05_audit:
        path: apps/api/src/platform/audit
        exposes: [mutation_audit, security_audit, pii_metadata_redaction]
      p02_authorization:
        path: apps/api/src/platform/authorization
        exposes: [Authorization.check, field_masking]
      ps01_employee_master:
        path: apps/api/src/modules/ps01
        exposes: [read_by_id, read_profile_masked, governed_identity_change]
        writes_to: [ps12_sr_ingestion]
      ps12_sr_ingestion:
        path: apps/api/src/modules/ps12
        exposes: [sr_ingest, source_reversal, employee_timeline]
        properties: [append_only, idempotent, semantic_dedup, source_driven_reversal]
      ps13_document_vault:
        path: apps/api/src/modules/ps13
        exposes: [document_create, document_attach, legal_hold, disposal_guard]
        properties: [legal_hold_fail_closed, worm_fail_closed, module_attachment_contract]
      x1_jobs:
        path: apps/api/src/jobs
        exposes: [idempotent_job_run]
      x2_notifications:
        path: apps/api/src/notifications
        exposes: [publish, list_scoped]
      p06_migration_staging:
        path: apps/api/src/migration/staging
        exposes: [stage_employee_identity, reconciliation_report_without_production_mutation]
    grounding: docs/spec/phased-plan.yaml PH-03; docs/tests/foundation-services-tests.md
  ph04_api_contract_layer:
    name: PH-04 /api/v1 route and contract layer
    owner: platform/api
    status: planned_pipeline_ready
    implementation_roots:
      - apps/api/src/http
      - apps/api/src/openapi
      - apps/api/src/routes
    phase_plan: docs/spec/ph-04-api-contract-implementation-plan.md
    pipeline:
      - PH-04A: API kernel and contract harness
      - PH-04B: P01 workflow and PS01 employee routes
      - PH-04C: PS12 Service Register and PS13 document routes
      - PH-04D: API conformance and freeze packet
    protected_route_rule: Every route is explicitly public or protected; PH-04 minimum route set is protected.
    cross_cutting_contracts:
      base_path: /api/v1
      auth: Bearer/JWT context + P02 Authorization.check on protected routes
      idempotency: Idempotency-Key required on unsafe/workflow-initiating POSTs
      correlation: X-Correlation-Id echoed on every response and written to audit/log evidence
      pagination: cursor pagination, default 25, max 100
      errors: canonical 8-code envelope from docs/contracts/error-taxonomy.yaml
    route_groups:
      p01_workflow:
        contract: docs/contracts/openapi/P01-workflow.yaml
        planned_file: apps/api/src/routes/p01-workflow.routes.ts
      ps01_employee_master:
        contract: docs/contracts/openapi/PS01.yaml
        planned_file: apps/api/src/routes/ps01.routes.ts
      ps12_sr_ingestion:
        contract: docs/contracts/openapi/PS12.yaml
        planned_file: apps/api/src/routes/ps12.routes.ts
      ps13_document_vault:
        contract: docs/contracts/openapi/PS13.yaml
        planned_file: apps/api/src/routes/ps13.routes.ts
    freeze_gate: PH-04D is human-gated after GREEN machine checks because API compatibility feeds PH-05 and module waves.
    grounding: docs/spec/phased-plan.yaml PH-04; docs/spec/ph-04-api-contract-implementation-plan.md

conflict_resolution:
  arbiter: Lead Architect
  rules:
    - When a enterprise BRD conflicts with a platform artefact on intent, the platform artefact governs; log the conflict as a convention override (MODULE_RECONCILIATION.md §C).
    - A shared contract (SR ingestion=PS12, employee master=PS01, documents=PS13, audit=P05) has exactly one owner; consumers reference by id and never fork the entity or re-author the engine.
    - SR writer-set disputes resolve to PS12 FR-01.B (the SR contract owner) as authoritative over any module's local claim (e.g. identity-change SR events belong to PS01, not PS02 — R3 F2 remediation).
    - A single BLOCKED module is quarantined (mock its write-port/reads) and does not freeze unrelated parallel work; the arbiter records the quarantine.
    - Schema-level cross-module collisions (duplicate table/index names) are resolved by the owning-module rename recorded in docs/data-model/README.md; the Lead Architect ratifies.

