# project.config.yaml — machine-readable project configuration.
# Read by feature-life-cycle, the guard hooks (db_change_guard.py, secrets_guard.py),
# and the deploy/local-deployment skills. Generated by new-project-setup.
# Replace every <placeholder>. This file + CLAUDE.md are what keep the pipeline
# portable — project specifics live here, not hardcoded in the skills.

project:
  name: <project-name>
  type: <greenfield | brownfield>

stack:
  runtime: <e.g. Node.js / Express, FastAPI, Next.js, Django>
  api_style: <REST | tRPC | GraphQL>
  api_port: <e.g. 3000>
  frontend: <e.g. React (Vite) | Next.js | none>
  database: <e.g. PostgreSQL via Drizzle | Prisma | SQLAlchemy>
  auth: <e.g. Supabase Auth | NextAuth | JWT + session>
  observability: <logger / tracing tool, or 'none yet'>

# Stack profile — skills/hooks/generators branch on this so the framework is not
# implicitly Node/Postgres/React. Pick a named stack pack or set the dimensions.
stack_profile:
  pack: <e.g. fastapi-postgres | nextjs-prisma-postgres | none>
  backend: <node | python | java | dotnet | go>
  frontend: <react | next | angular | none>
  database: <postgres | mysql | oracle | mongodb>
  test_runner: <jest | vitest | pytest | junit | playwright>
  deployment: <docker | cloud-run | k8s | vercel>

# Optional domain pack — encodes domain risk controls (audit, tenancy, money movement…).
# Author/review with a real domain expert before trusting it.
domain_pack: <e.g. fintech-payments | multi-tenant-saas | none>

source:
  globs: ["src/", "app/", "lib/"]      # what the test/lint hooks treat as source

database:
  # NEW PROJECTS DEFAULT TO 'migrations'. Only set 'schema-direct' if you have a
  # deliberate pre-launch reason and a documented switch-back trigger.
  change_policy: migrations            # migrations | schema-direct
  schema_file: <path to ORM schema, if any>
  introspect_cmd: <command to verify schema, if any>
  # Dirs the db_change_guard hook treats specially:
  #   - under 'schema-direct': writes here are BLOCKED (migrations dormant)
  #   - under 'migrations': this is where migrations SHOULD live (not blocked)
  migration_dirs: [<e.g. db/migrations>]
  # Any write/DDL touching these tables is blocked without approval:
  sensitive_tables: [<e.g. users, payments>]
  # Commands the guard blocks outright (e.g. a push that bypasses your policy):
  forbidden_commands: []

layering:
  db_access: <e.g. server/repositories/>
  business_logic: <e.g. server/services/>
  path_aliases: [<e.g. "@/*">]

commands:
  dev: <dev command>
  build: <build command>
  test: <test command>
  typecheck: <type-check command>

coordination:
  announce_channel: <e.g. "#db-changes", or 'none'>
  announce_for: [DROP, ALTER, large UPDATE, changes to sensitive tables]

escalation:
  max_gate_remediation_cycles: 3
  max_fr_retries: 2

# Decision policies — the "middle category" between auto and escalate. The agent applies
# the default and LOGS it to decisions.yaml; it escalates only where human_required is true.
# (This is config, not a separate engine — it lives alongside the contracts/NFR thresholds.)
decision_policies:
  pagination:        { default_page_size: 50, max_page_size: 200, human_required: false }
  delete_behavior:   { default: soft_delete, hard_delete_requires_human: true }
  external_api_failure: { default: retry_with_backoff_then_domain_error, human_required_if_money_movement: true }
  auth_default:      { default: deny, public_endpoint_requires_explicit_contract: true }
  schema_change:     { additive_change: auto, destructive_change: human_required }

# CI-required gates — the REAL merge gate (hooks are only the local guardrail).
# Tier each: 'block' stops the merge; 'warn' reports but does not block (manage flake here).
ci_gates:
  block: [build, typecheck, lint, unit_tests, contract_tests, migration_dry_run,
          dependency_vuln_scan, secret_scan, traceability_validation]
  warn:  [integration_tests, e2e_touched_flows, coverage_threshold, sast_scan,
          api_contract_drift, accessibility_scan]
