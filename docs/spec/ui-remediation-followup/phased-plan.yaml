      - "Review 'Remaining risks' — restated with current status"
      - "Production release is unblocked only if FR-01, FR-02, FR-04, and FR-10 are all closed"
    files_expected:
      - docs/release/ui-remediation-followup-readiness.md
      - docs/evidence/ui-remediation-followup/urf-09-final-log.md
    generated_tests: []
    verification_commands:
      - npm run check
      - npm run web:check
      - npm run web:test:e2e
      - npm audit --audit-level=low
      - bash docs/spec/pipeline/checks/ph-05e.sh
      - bash docs/spec/ui-remediation-pipeline/checks/uir-08.sh
      - bash ops/security-headers-verification.sh
      - production build negative scan for demo credentials and alg:none
    review_criteria:
      - Every command's exact result is pasted, not summarized.
      - The verdict states which of the original 17 findings remain open and why.
      - A CONDITIONAL verdict is reported as CONDITIONAL; the gate is a human's to pass.
    rollback: none — evidence phase. A red result parks; it does not revert.
    retry_policy: { max_attempts: 1, on_failure: park_for_human }
    escalation: Production/go-live approval — human gate by standing policy.

# =============================================================================
# DEPENDENCY VIEW
# =============================================================================
dependency_graph:
  URF-00: []
  URF-00R: [URF-00]
  URF-01: [URF-00R]
  URF-02: [URF-01]
  URF-03: [URF-02]
  URF-04: [URF-03]
  URF-05: [URF-01]
  URF-06: [URF-04, URF-05]
  URF-07: [URF-00R]
  URF-08: [URF-06, URF-07]
  URF-09: [URF-08]

parallelizable_groups:
  - group: G0
    phases: [URF-00]
    note: sequential entry point; everything downstream reads its matrix
  - group: G0R
    phases: [URF-00R]
    note: >
      blocking. Inserted after URF-00 found the baseline red. Everything whose oracle calls
      npm run web:check depends on it.
  - group: G1
    phases: [URF-01]
    note: human decision gate; blocks the auth chain and the header work
  - group: G2
    concurrent:
      - lane: G2a
        phases: [URF-02, URF-03, URF-04]
        note: auth chain; strictly sequential within the lane
      - lane: G2b
        phases: [URF-05]
        note: header policy; shares no files with G2a
      - lane: G2c
        phases: [URF-07]
        note: UI residue; may start right after URF-00R, before URF-01 ratifies
    file_conflict_check: >
      G2a touches apps/api and server.mjs decodeActor; G2b touches server.mjs response headers.
      Both edit server.mjs — run them in separate worktrees or serialize the server.mjs edit,
      otherwise the lanes conflict. This is the only overlap in the plan.
  - group: G3
    phases: [URF-06]
  - group: G4
    phases: [URF-08]
  - group: G5
    phases: [URF-09]

# =============================================================================
# GATES
# =============================================================================
phase_gates:
  gate_a_baseline_truth:
    after: URF-00
    gate: auto
    pass_when:
      - The finding-state matrix covers all 17 findings with evidence references.
      - All verification commands ran and their real results are recorded, pass or fail.
    blocks: [URF-00R]
  gate_a2_baseline_green:
    after: URF-00R
    gate: auto
    pass_when:
      - npm run check, npm run web:check, and ph-05e.sh are all GREEN.
      - Every re-anchored assertion is justified in the URF-00R triage document.
      - Repaired oracles fail on a planted value and on a missing scan target.
    blocks: [URF-01, URF-07]
  gate_b_amendment_ratified:
    after: URF-01
    gate: human
    pass_when:
      - D-AUTH-01, D-AUTH-02, D-AUTH-03, and D-SEC-01 are decided and owned.
      - No amendment weakens RBAC, tenant isolation, or the server-authoritative boundary.
    blocks: [URF-02, URF-05]
  gate_c_schema_approved:
    after: URF-02
    gate: human
    pass_when:
      - Migration is additive, tenant-scoped, and recorded in .claude/approved-db-changes.txt.
      - A compensating migration is written down before the forward one is applied.
    blocks: [URF-03]
  gate_d_auth_boundary_real:
    after: URF-04
    gate: auto
    pass_when:
      - alg:none, bad signature, expired, wrong issuer/audience, and missing tenant all fail closed.
      - No code path reconstructs actor context from unverified claims.
    blocks: [URF-06]
  gate_e_release_decision:
    after: URF-09
    gate: human
    pass_when:
      - FR-01, FR-02, FR-04, and FR-10 are closed with executed evidence.
      - The complete oracle is GREEN and its output is attached verbatim.
    outcome: human_release_decision

# =============================================================================
# TRACEABILITY
# =============================================================================
traceability:
  finding_to_phase:
    FR-01: [URF-00, URF-06]
    FR-02: [URF-01, URF-02, URF-03, URF-04, URF-06]
    FR-03: [URF-00, URF-06]         # regression guard only
    FR-04: [URF-00, URF-08]
    FR-05: [URF-00]                 # regression guard only
    FR-06: [URF-07]
    FR-07: [URF-00]                 # regression guard only
    FR-08: [URF-07]
    FR-09: [URF-08]
    FR-10: [URF-01, URF-05]
    FR-11: [URF-00]                 # regression guard only
    FR-12: [URF-00, URF-08]
    FR-13: [URF-07, URF-08]
    FR-14: [URF-00, URF-06]         # regression guard only
    FR-15: [URF-00]                 # regression guard only
    FR-16: [URF-07, URF-08]
    FR-17: [URF-07]
  evidence_required_per_phase:
    - changed files
    - generated tests and their names
    - verbatim command output
    - screenshots for UI phases
    - schema load log for the migration phase
    - a ledger entry per finding touched, with an explicit closure state

# =============================================================================
# RISKS
# =============================================================================
risks:
  - id: R-01
    risk: Both G2a and G2b edit server.mjs.
    mitigation: Serialize the server.mjs edit or run the lanes in separate git worktrees.
  - id: R-02
    risk: A strict CSP breaks the built SPA and is discovered only at URF-09.
    mitigation: URF-05's oracle runs the browser suite against a header-enabled server, not a bare build.
  - id: R-03
    risk: Choosing HttpOnly cookies (D-AUTH-02) invalidates the sessionStorage bearer path the whole web client is built on.
    mitigation: The decision is made at URF-01, before any implementation phase starts; URF-06 sizes the client change from the ratified answer.
  - id: R-04
    risk: The review's file:line anchors are 14 days and ~25 commits stale, so a phase could repair code that no longer exists.
    mitigation: URF-00 exists precisely for this and blocks everything else.
  - id: R-05
    risk: Evidence regeneration re-inherits default-closed states from the old ledger.
    mitigation: URF-08 ships an executable ledger-integrity check that fails on anchor-inherited closure.
