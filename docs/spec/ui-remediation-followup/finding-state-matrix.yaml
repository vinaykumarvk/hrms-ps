escalation:
  raised_by: URF-00
  severity: blocking_for_the_plan_as_written
  summary: >
    The baseline is materially worse than the review's record, in ways the follow-up plan did
    not contemplate. Four of the seven verification commands are RED and two cannot run at all;
    only `npm run check` passes.
  items:
    - id: ESC-01
      title: The web build does not typecheck
      detail: >
        80 TypeScript errors across 6 files block `web:typecheck`, and therefore `web:build` and
        `web:test` never run under `web:check`. Probable single root cause in
        apps/web/src/lib/useForm.ts:113. This is a regression against the review's "153/153 pass".
      consequence: >
        Every URF phase whose oracle calls `npm run web:check` (URF-05, URF-06, URF-07) is RED
        before it starts. The pipeline cannot progress past URF-00 as written.
    - id: ESC-02
      title: 26 web unit tests fail
      detail: >
        127/153 pass. At least one failure is a stale assertion rather than a defect — the
        design-token migration replaced `min-height: 2.75rem` with `var(--min-touch)` while the
        test still asserts the literal.
      consequence: PH-05E is RED; the release gate cannot be reached.
    - id: ESC-03
      title: The inherited release oracle cannot fail
      detail: >
        uir-08.sh's production-credential negative scan uses `rg`, which is not installed. The
        assertion passes without scanning anything, in the exact environment the driver uses.
      consequence: >
        FR-01's closure evidence is vacuous. Any historical GREEN from uir-08.sh should be
        treated as unproven for the negative-scan portion.
    - id: ESC-04
      title: The e2e gate is unrunnable in the presence of a dev server
      detail: >
        reuseExistingServer:false plus an occupied port 5173 produces an indefinite silent hang.
        No e2e evidence could be gathered in this phase.
      consequence: FR-12 and FR-13 cannot be verified; both were downgraded to open.
  recommendation: >
    Insert a repair phase — call it URF-00R — between URF-00 and URF-01, scoped to: fix the
    useForm generic and its 79 downstream errors; triage the 26 failing web tests, separating
    stale assertions from real defects; port the ui-remediation checks off `rg` or install
    ripgrep; and make the e2e gate fail fast on an occupied port. None of this is UI-remediation
    work in the review's sense, but the plan's gate A cannot be reached without it, and every
    later oracle depends on it. This decision belongs to a human — it changes the shape of the
    approved plan.
